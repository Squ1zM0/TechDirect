name: Rebuild directory index

on:
  push:
    branches: [main]
    paths:
      - "tech-support-directory/data/manufacturers/**"
      - "tech-support-directory/scripts/build-index.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Rebuild index
        working-directory: tech-support-directory
        run: node scripts/build-index.ts
      - name: Commit rebuilt dist if changed
        run: |
          git config user.name "Cobalt"
          git config user.email "235203934+Squ1zM0@users.noreply.github.com"
          git add tech-support-directory/dist
          if git diff --cached --quiet; then
            echo "No index changes."
          else
            git commit -m "Rebuild directory index from YAML source"
            git push
          fi
