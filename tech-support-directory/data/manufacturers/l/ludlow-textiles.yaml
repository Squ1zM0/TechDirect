    notes: "Legacy brand. Ludlow Textiles Co. Inc., founded 1868 in Ludlow, MA, manufactured industrial cords, tapes, threads, twines and yarns (including waxed linen lacing cord used in electrical work). In April 2005 American & Efird (A&E) purchased certain assets of Ludlow's thread and specialty yarn business, and Ludlow ceased all operations over the following year. Support routes through successor A&E's published toll-free corporate line (Mount Holly, NC; A&E is a portfolio company of Elevate Textiles). Hardware is the closest category-vocabulary term for industrial thread/cord products."
    source: "https://www.amefird.com/blog/2012/12/"
    last_verified: "2026-10-26"
