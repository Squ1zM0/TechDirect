    notes: "Palmer Industries, Warwick, RI (71 Cypress St, 02888). Number published in the company's Decorative Plumbing + Hardware Association member listing and on the company's own showroom page. Manufacturer of custom, high-end architectural metalworks, vanity sink legs, console leg systems for bath sinks, and designer shelving (sinklegs.com); founded 1980. Distinct from Palmer Industries, Inc., Akron, OH (bearings, hose couplings) and Palmer Industries, Alexandria, MN (plastic straps), which are different companies. General company number, not labelled technical support, so recorded as Customer Support."
