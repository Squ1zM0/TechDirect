    notes: "Plymouth Rubber Company, Inc., Canton, MA (275 Turnpike St, Suite 310). Number published in the company's Thomasnet profile and its own electrical-tape catalogs (info@plymouthtape.com). Founded 1896; manufacturer of electrical, rubber, vinyl, and pressure-sensitive tapes for electrical insulation and splicing. Filed Chapter 11 in July 2005 and exited under a settlement (pension plan terminated, liabilities assumed by PBGC); European operations continue as Plymouth Rubber Europa (Spain, +34 986 330 562). A place listing for Plymouth Rubber, Canton, MA, also shows a toll-free 800-458-0336 and plymouthrubber.com; the Thomasnet/catalog number is used as the phone field because it is tied to the US electrical-tape business. General company number, not labelled technical support, so recorded as Customer Support."
