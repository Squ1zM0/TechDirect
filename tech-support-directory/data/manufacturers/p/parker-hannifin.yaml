    notes: "Parker-Hannifin Corporation, Mayfield Heights, OH (corporate headquarters). Main corporate number published by Parker Hannifin company profiles; Parker support is routed through divisions and distributors, so recorded as Customer Support, not Technical Support. Motion and control technologies: hydraulics, pneumatics, fluid connectors (fittings, valves, hoses) — no hydraulics/pneumatics term exists in the category vocabulary, so plumbing (fittings/valves/hoses) is the closest term. Distinct from the existing parker-sporlan file, which is the Sporlan Division only. Covers xref spellings Parker, Parker Hannifin Corporation, and Parker-Hannifin; the Brass Products Division is a Parker Hannifin division with no distinct support contact and resolves to this file."
