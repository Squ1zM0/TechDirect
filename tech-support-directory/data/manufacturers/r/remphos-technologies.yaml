    notes: "Legacy/acquired brand, filed on its own per the legacy rule (never merged away). RemPhos Technologies LLC, 90 Holten St, Danvers, MA 01923, was a manufacturer of LED lighting products (LED tubes, bulbs, fixtures, modules, flood lights, sensors; Thomasnet profile) founded 2008/2009. PitchBook records RemPhos as acquired/merged on 2018-02-01 by Light Efficient Design (existing staged file light-efficient-design, batch-11). Support is therefore via the successor: Light Efficient Design, North Barrington, IL, 847-380-3540. Caveat, carried from the successor file: that number comes from a trade-source company profile, not an official-site contact page, so it is a successor trade-source number, not an official-site number. RemPhos's own pre-acquisition numbers — 877-997-3674 (Manta listing) and 978-884-8377 (GovCB vendor profile) — are checked evidence only and are NOT published, as their post-acquisition currency is unverified. Phase 1 recorded 'no match found'; the company, its product line and its acquirer were identified in this rework."
