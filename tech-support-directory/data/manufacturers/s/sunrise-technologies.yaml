  notes: "Sunrise Technologies, Inc. / FP Outdoor Lighting Controls, Raynham, MA (370 Paramount Drive, Raynham, MA 02767). Outdoor lighting controls (photocontrols, contactors, wireless street/area lighting controls); websites fpolc.com and suntech.biz. Number is the company line on an FP-OLC spec sheet; a NEMRA listing names SUNRISE TECHNOLOGIES / FP Outdoor Lighting Controls at the same Raynham address as the leading US-made outdoor lighting control company tracing to the first twistlock photocontrol in 1958. Individual contact numbers seen in the NEMRA listing are deliberately NOT published. Covers both the 'Sunrise Tech' and 'Sunrise Technologies' rows (same company). Shares its company line with the separate sun-tech brand file by design; the two cross-note each other."
