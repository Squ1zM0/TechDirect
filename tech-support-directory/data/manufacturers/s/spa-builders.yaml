    notes: "Spa Builders Systems Group (SBSG), formerly 9225 Stellar Court, Corona, CA 92883, and Spa Builders Support Group, Inc., 1219 South Bon View Avenue, Ontario, CA 91761. Manufacturer of spa control systems and components (LX-10, LX-15, LX-20, LX-25, LX-30 control packs, topsides, heaters and pumps). Number 1-866-639-7274 is published in Spa Builders' own MC-MP-SBD Owner's Manual ('phone us at our tollfree number') and as the SBSG customer service department number for warranty return authorizations; it is a customer-service line, not labelled Technical Support. The LX troubleshooting guides also publish a Las Vegas office line, 800-772-7257, noted here in text only and not filed as the support number. Caveat (DESA precedent): current operability is not independently confirmed — all numbers are manufacturer-manual numbers, no verified current official website was found, and some Australian listings describe the LX line as obsolete. The parts dealer's number (Bath & Spa Parts Online, 800-918-9143) is NOT used. Allied Innovations markets/distributes Spa Builders among other spa brands; it is not adopted as a successor."
    source: "https://cdn3.guidespdf.com/view/1589/1589439-mclass_mcmpsbd.pdf"
